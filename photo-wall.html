<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏝️ 今日照片墙 - Animal Island</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #19c8b9;
            --primary-hover: #3dd4c6;
            --primary-active: #11a89b;
            --text: #794f27;
            --text-body: #725d42;
            --text-secondary: #9f927d;
            --text-muted: #8a7b66;
            --border-light: #c4b89e;
            --bg: #f8f8f0;
            --bg-content: rgb(247, 243, 223);
            --bg-secondary: #f0e8d8;
            --shadow-btn: #bdaea0;
            --shadow-card: rgba(107, 92, 67, 0.42);
            --success: #6fba2c;
            --warning: #f5c31c;
            --error: #e05a5a;
            --app-orange: #e59266;
            --app-teal: #82d5bb;
            --app-yellow: #f7cd67;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Nunito, 'Noto Sans SC', 'Zen Maru Gothic', -apple-system, 'PingFang SC', sans-serif;
            background: var(--bg); color: var(--text-body); min-height: 100vh; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(25,200,185,.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(248,166,178,.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(247,205,103,.04) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        @keyframes float-leaf { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-8px) rotate(5deg)} 75%{transform:translateY(-10px) rotate(2deg)} }
        @keyframes animal-zoom-in { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
        @keyframes ac-fade-up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(25,200,185,.3)} 50%{box-shadow:0 0 20px 4px rgba(25,200,185,.15)} }
        @keyframes blink { 50%{opacity:0} }
        @keyframes spin { to{transform:rotate(360deg)} }

        .header { position:relative;z-index:10;text-align:center;padding:40px 20px 20px;animation:ac-fade-up .6s ease-out; }
        .header-leaf { font-size:48px;display:inline-block;animation:float-leaf 3s ease-in-out infinite; }
        .header h1 { font-size:28px;font-weight:800;color:var(--text);margin:8px 0 4px; }
        .header .subtitle { font-size:14px;color:var(--text-secondary);font-weight:500; }
        .header .date-badge { display:inline-block;margin-top:12px;padding:6px 20px;background:var(--bg-content);border:2px solid var(--border-light);border-radius:50px;font-size:13px;font-weight:600;color:var(--text-body);box-shadow:0 3px 0 0 var(--shadow-btn); }

        .status-bar { position:relative;z-index:10;display:flex;justify-content:center;gap:16px;padding:0 20px 24px;flex-wrap:wrap;animation:ac-fade-up .6s ease-out .1s both; }
        .status-chip { display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg-content);border:2px solid var(--border-light);border-radius:50px;font-size:12px;font-weight:600;color:var(--text-body);box-shadow:0 2px 0 0 var(--shadow-btn);transition:all .25s; }
        .status-chip .dot { width:8px;height:8px;border-radius:50%;animation:pulse-glow 2s ease-in-out infinite; }
        .status-chip .dot.ok { background:var(--success); }
        .status-chip .dot.err { background:var(--error);animation:none; }
        .config-btn { cursor:pointer;background:var(--app-yellow)!important;border-color:#d4a843!important; }
        .config-btn:hover { background:#f0c04d!important;transform:translateY(-1px);box-shadow:0 4px 0 0 #c49a30!important; }
        .config-btn:active { transform:translateY(2px);box-shadow:0 1px 0 0 #c49a30!important; }
        .config-btn .cfg-dot { width:8px;height:8px;border-radius:50%;background:var(--app-orange); }

        .photo-grid { position:relative;z-index:10;max-width:1300px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px; }
        .photo-card { background:var(--bg-content);border:2.5px solid var(--border-light);border-radius:18px;overflow:hidden;box-shadow:0 4px 10px var(--shadow-card);transition:all .3s ease;animation:animal-zoom-in .5s ease-out both;cursor:pointer; }
        .photo-card:nth-child(1){animation-delay:.05s} .photo-card:nth-child(2){animation-delay:.1s}
        .photo-card:nth-child(3){animation-delay:.15s} .photo-card:nth-child(4){animation-delay:.2s}
        .photo-card:nth-child(5){animation-delay:.25s} .photo-card:nth-child(6){animation-delay:.3s}
        .photo-card:nth-child(7){animation-delay:.35s} .photo-card:nth-child(8){animation-delay:.4s}
        .photo-card:hover { transform:translateY(-4px);box-shadow:0 8px 24px rgba(61,52,40,.18);border-color:var(--primary); }
        .photo-card .img-wrapper { position:relative;width:100%;padding-top:75%;overflow:hidden;background:var(--bg-secondary); }
        .photo-card .img-wrapper img { position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease; }
        .photo-card:hover .img-wrapper img { transform:scale(1.05); }
        .ai-badge { position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:2px solid var(--primary);border-radius:50px;font-size:11px;font-weight:700;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.1); }
        .ai-badge .star { color:var(--warning); }
        .photo-info { padding:14px 16px; }
        .photo-info .photo-title { font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px; }
        .photo-info .photo-desc { font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px; }
        .photo-tags { display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0; }
        .photo-tag { padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600;border:1.5px solid; }
        .tag-scene { background:#e6f9f6;border-color:var(--primary);color:var(--primary); }
        .tag-mood { background:#fef3e2;border-color:var(--app-orange);color:var(--app-orange); }
        .tag-style { background:#f0e6f8;border-color:#b77dee;color:#b77dee; }
        .tag-nsfw { background:#fde8e8;border-color:var(--error);color:var(--error);font-weight:700; }
        .ai-comment { display:flex;gap:8px;padding:10px 12px;background:linear-gradient(135deg,rgba(25,200,185,.06),rgba(130,213,187,.08));border:1.5px solid rgba(25,200,185,.2);border-radius:12px;margin-top:2px; }
        .ai-comment-icon { font-size:16px;flex-shrink:0;margin-top:1px; }
        .ai-comment-text { font-size:12px;color:var(--text-body);line-height:1.6; }
        .ai-comment-loading { font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px; }
        .ai-comment-loading .dot-anim { display:inline-flex;gap:3px; }
        .ai-comment-loading .dot-anim span { width:4px;height:4px;border-radius:50%;background:var(--primary);animation:dot-bounce 1.2s ease-in-out infinite; }
        .ai-comment-loading .dot-anim span:nth-child(2){animation-delay:.2s} .ai-comment-loading .dot-anim span:nth-child(3){animation-delay:.4s}
        @keyframes dot-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

        .ai-panel { position:relative;z-index:10;max-width:1300px;margin:0 auto 40px;padding:0 24px;animation:ac-fade-up .6s ease-out .5s both; }
        .ai-panel-card { background:var(--bg-content);border:2.5px solid var(--border-light);border-radius:18px;padding:24px;box-shadow:0 4px 10px var(--shadow-card); }
        .ai-panel-card h2 { font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px; }
        .ai-thinking { display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--bg);border-radius:14px;border:2px solid var(--border-light); }
        .ai-avatar { width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--app-teal));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 3px 0 0 var(--primary-active); }
        .ai-text { font-size:14px;color:var(--text-body);line-height:1.7;white-space:pre-wrap; }
        .ai-text strong { color:var(--text); }
        .ai-cursor { display:inline-block;width:2px;height:14px;background:var(--primary);margin-left:2px;animation:blink 1s step-end infinite;vertical-align:middle; }

        .refresh-area { position:relative;z-index:10;text-align:center;padding:0 20px 60px;animation:ac-fade-up .6s ease-out .6s both; }
        .refresh-btn { display:inline-flex;align-items:center;gap:8px;padding:12px 32px;background:var(--primary);color:#fff;border:none;border-radius:50px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 0 var(--primary-active);transition:all .25s; }
        .refresh-btn:hover { transform:translateY(-1px);background:var(--primary-hover);box-shadow:0 6px 0 0 var(--primary-active); }
        .refresh-btn:active { transform:translateY(2px);box-shadow:0 1px 0 0 var(--primary-active); }
        .refresh-btn .icon { display:inline-block;transition:transform .3s; }
        .refresh-btn:hover .icon { transform:rotate(180deg); }
        .refresh-btn.loading .icon { animation:spin .8s linear infinite; }
        .refresh-btn:disabled { opacity:.6;cursor:not-allowed; }
        .footer-wave { width:100%;height:60px;background:linear-gradient(180deg,transparent 0%,rgba(130,213,187,.1) 100%);border-radius:50% 50% 0 0/100% 100% 0 0; }
        .footer-deco { position:relative;z-index:10;text-align:center;padding:20px;color:var(--text-muted);font-size:12px; }

        /* Modal */
        .modal-overlay { display:none;position:fixed;inset:0;background:rgba(30,25,18,.92);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center; }
        .modal-overlay.active { display:flex;animation:animal-fade-in .3s ease-out; }
        @keyframes animal-fade-in { from{opacity:0} to{opacity:1} }
        .modal-content { position:relative;width:calc(100vw - 40px);height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center; }
        .modal-img-wrapper { max-width:100%;max-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center; }
        .modal-img-wrapper img { max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.4);animation:animal-zoom-in .35s ease-out; }
        .modal-title-bar { position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(30,25,18,.75);backdrop-filter:blur(10px);border-radius:50px;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3); }
        .modal-close { position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(30,25,18,.6);backdrop-filter:blur(10px);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:10; }
        .modal-close:hover { background:var(--error);border-color:var(--error); }
        .modal-nav { position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(30,25,18,.5);backdrop-filter:blur(10px);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:10; }
        .modal-nav:hover { background:rgba(30,25,18,.8);border-color:rgba(255,255,255,.5); }
        .modal-nav.prev { left:10px; }
        .modal-nav.next { right:10px; }
        .modal-counter { position:absolute;top:10px;left:10px;padding:6px 14px;border-radius:50px;background:rgba(30,25,18,.6);backdrop-filter:blur(10px);font-size:12px;font-weight:600;color:rgba(255,255,255,.8);z-index:10; }

        /* Config Modal */
        .config-overlay { display:none;position:fixed;inset:0;background:rgba(30,25,18,.7);backdrop-filter:blur(6px);z-index:2000;justify-content:center;align-items:center; }
        .config-overlay.active { display:flex;animation:animal-fade-in .3s ease-out; }
        .config-panel { background:var(--bg-content);border:3px solid var(--border-light);border-radius:22px;padding:32px;max-width:480px;width:calc(100% - 40px);box-shadow:0 12px 40px rgba(61,52,40,.25); }
        .config-panel h3 { font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:8px; }
        .config-field { margin-bottom:16px; }
        .config-field label { display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px; }
        .config-field input, .config-field select {
            width:100%;padding:10px 16px;border:2.5px solid var(--border-light);border-radius:12px;
            background:var(--bg);font-family:inherit;font-size:13px;font-weight:500;color:var(--text-body);
            outline:none;transition:border-color .2s;
        }
        .config-field input:focus, .config-field select:focus { border-color:var(--primary); }
        .config-field .hint { font-size:11px;color:var(--text-muted);margin-top:4px; }
        .config-actions { display:flex;gap:10px;margin-top:20px; }
        .config-actions button { flex:1;padding:10px;border:none;border-radius:50px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s; }
        .btn-save { background:var(--primary);color:#fff;box-shadow:0 4px 0 0 var(--primary-active); }
        .btn-save:hover { background:var(--primary-hover);transform:translateY(-1px); }
        .btn-save:active { transform:translateY(2px);box-shadow:0 1px 0 0 var(--primary-active); }
        .btn-cancel { background:var(--bg);color:var(--text-body);border:2px solid var(--border-light)!important;box-shadow:0 3px 0 0 var(--shadow-btn); }
        .btn-cancel:hover { background:var(--bg-secondary); }
        .config-status { margin-top:12px;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;display:none; }
        .config-status.ok { display:block;background:#e6f9f6;color:var(--primary);border:1.5px solid var(--primary); }
        .config-status.err { display:block;background:#fde8e8;color:var(--error);border:1.5px solid var(--error); }

        @media (max-width:1000px) { .photo-grid{grid-template-columns:repeat(2,1fr);} }
        @media (max-width:600px) { .header h1{font-size:22px} .photo-grid{grid-template-columns:1fr;padding:0 16px 32px} }
    </style>
</head>
<body>
    <header class="header">
        <span class="header-leaf">🍃</span>
        <h1>今日精选照片墙</h1>
        <p class="subtitle">AI 视觉大模型每日自动挑选 · 动物森友会风格</p>
        <div class="date-badge" id="dateBadge"></div>
    </header>

    <div class="status-bar">
        <div class="status-chip config-btn" onclick="openConfig()">⚙️ <span class="cfg-dot"></span> AI 视觉配置</div>
        <div class="status-chip" id="aiStatus"><span class="dot" id="aiDot"></span> <span id="aiModel">AI 检测中…</span></div>
        <div class="status-chip">📸 <span id="photoCount">0</span> 张精选</div>
        <div class="status-chip">🕐 <span id="lastUpdate">--:--</span> 更新</div>
    </div>

    <div class="photo-grid" id="photoGrid"></div>

    <div class="ai-panel">
        <div class="ai-panel-card">
            <h2>🤖 AI 选片总结</h2>
            <div class="ai-thinking">
                <div class="ai-avatar">🧠</div>
                <div class="ai-text" id="aiAnalysis"><span class="ai-cursor"></span></div>
            </div>
        </div>
    </div>

    <div class="refresh-area">
        <button class="refresh-btn" id="refreshBtn" onclick="refreshPhotos()">
            <span class="icon">🔄</span> 换一批照片
        </button>
    </div>

    <div class="footer-wave"></div>
    <div class="footer-deco">🏝️ Powered by AI Visual Model · Animal Island Style</div>

    <!-- Photo Modal -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <span class="modal-counter" id="modalCounter">1 / 8</span>
            <button class="modal-nav prev" onclick="navPhoto(-1)">‹</button>
            <button class="modal-nav next" onclick="navPhoto(1)">›</button>
            <div class="modal-img-wrapper">
                <img id="modalImg" src="" alt="" />
            </div>
            <div class="modal-title-bar" id="modalTitle">📷 照片</div>
        </div>
    </div>

    <!-- Config Modal -->
    <div class="config-overlay" id="configModal" onclick="closeConfig(event)">
        <div class="config-panel" onclick="event.stopPropagation()">
            <h3>⚙️ 视觉大模型配置</h3>
            <div class="config-field">
                <label>API 地址</label>
                <input type="text" id="cfgApiBase" placeholder="https://api.openai.com/v1" />
                <div class="hint">OpenAI / DeepSeek / Qwen 等兼容接口地址</div>
            </div>
            <div class="config-field">
                <label>API Key</label>
                <input type="password" id="cfgApiKey" placeholder="sk-..." />
                <div class="hint">密钥仅保存在浏览器本地，不会上传</div>
            </div>
            <div class="config-field">
                <label>模型名称</label>
                <input type="text" id="cfgModel" placeholder="gpt-4o / qwen-vl-plus / deepseek-chat" />
                <div class="hint">需要支持视觉能力（Vision）的模型</div>
            </div>
            <div class="config-field">
                <label>照片文件夹路径</label>
                <input type="text" id="cfgFolder" placeholder="/opt/1panel/apps/easyimage2/easyimage2/data/i" />
                <div class="hint">服务器上照片存放的绝对路径</div>
            </div>
            <div class="config-status" id="cfgStatus"></div>
            <div class="config-actions">
                <button class="btn-cancel" onclick="closeConfig()">取消</button>
                <button class="btn-save" onclick="saveConfig()">💾 保存</button>
            </div>
        </div>
    </div>

<script>
// ========== Config ==========
const PHOTO_API = 'http://localhost:8088';
const STORAGE_KEY = 'photo-wall-config';

function loadConfig() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return {
            apiBase: saved.apiBase || '',
            apiKey: saved.apiKey || '',
            model: saved.model || '',
            folder: saved.folder || '/opt/1panel/apps/easyimage2/easyimage2/data/i'
        };
    } catch { return { apiBase: '', apiKey: '', model: '', folder: '/path/to/your/photos' }; }
}

function saveConfigToStorage(cfg) { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); }

let config = loadConfig();
let photoDatabase = [];
let currentPhotos = [];
let currentModalIndex = 0;

// ========== Utils ==========
function generateScore() { return (9 + Math.random() * 0.9).toFixed(1); }
const tagPool = [
    {text:'风景',type:'scene'},{text:'自然',type:'scene'},{text:'森林',type:'scene'},
    {text:'海滩',type:'scene'},{text:'城市',type:'scene'},{text:'治愈',type:'mood'},
    {text:'宁静',type:'mood'},{text:'梦幻',type:'mood'},{text:'浪漫',type:'mood'},
    {text:'震撼',type:'mood'},{text:'暖色调',type:'style'},{text:'冷色调',type:'style'},
    {text:'光影',type:'style'},{text:'氛围感',type:'style'},{text:'nsfw',type:'nsfw'}
];
function randomTags() { return [...tagPool].sort(()=>Math.random()-.5).slice(0,2+Math.floor(Math.random()*2)); }
function shuffleArray(a) { const s=[...a]; for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]];} return s; }

// ========== Fetch Photos ==========
async function fetchPhotosFromFolder(folder) {
    try {
        const resp = await fetch(`${PHOTO_API}/api/photos?folder=${encodeURIComponent(folder)}`);
        const data = await resp.json();
        if (data.error) return [];
        return data.files.map(f => ({
            url: `${PHOTO_API}${f.url}`,
            title: f.name.replace(/\.[^.]+$/, ''),
            desc: '',
            score: generateScore(),
            tags: []
        }));
    } catch (e) {
        console.warn('无法连接 Photo API:', e.message);
        return null;
    }
}

// ========== Vision API (via backend proxy) ==========
async function analyzePhotosWithVision(photos) {
    try {
        // Use the currently displayed photo URLs directly
        const imageUrls = photos.slice(0, 4).map(p => p.url);

        const resp = await fetch(`${PHOTO_API}/api/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageUrls })
        });
        const data = await resp.json();
        if (data.error) {
            console.warn('Vision API error:', data.error);
            return generateFallbackAnalysis(photos);
        }
        return data.analysis || generateFallbackAnalysis(photos);
    } catch (e) {
        console.warn('Vision API 调用失败:', e);
        return generateFallbackAnalysis(photos);
    }
}

function generateFallbackAnalysis(photos) {
    const fallbackComments = [
        '构图均衡，光影柔和，色彩层次丰富，充满生活气息',
        '光线运用出色，主体突出，背景虚化自然',
        '色彩饱和度恰到好处，画面温暖治愈',
        '角度独特，细节丰富，有很强的故事感',
        '氛围感十足，冷暖色调交织，情绪表达到位',
        '画面干净利落，留白得当，意境悠远',
        '瞬间抓拍精准，动态感强，生动有趣',
        '色调统一，构图讲究，视觉冲击力强'
    ];
    const fallbackTags = [
        '风景,治愈,暖色调', '人像,温暖,光影', '自然,宁静,氛围感',
        '动物,欢乐,高饱和', '建筑,极简,冷色调', '街拍,胶片感,复古',
        '夜景,神秘,光影', '花卉,梦幻,暖色调', '人像,nsfw,氛围感',
        '人像,nsfw,梦幻'
    ];
    const lines = photos.map((p, i) => `[${i+1}] ${fallbackComments[i % fallbackComments.length]} | 评分: ${p.score} | 标签: ${fallbackTags[i % fallbackTags.length]}`);
    return lines.join('\n') + '\n[总结] 今天精选了 ' + photos.length + ' 张照片，整体色彩和谐，构图均衡。其中第 1 张最为出色，光影层次丰富、氛围感强，建议作为首选。整体风格统一，每张都有独特的故事感。';
}

// ========== Render ==========
function renderPhotos(photos, comments) {
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    currentPhotos = photos;
    photos.forEach((photo, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.style.animationDelay = `${0.05 + i * 0.05}s`;
        card.onclick = (e) => { if(e.target.closest('.ai-comment')) return; openModal(i); };
        const tagsHtml = photo.tags.length > 0
            ? photo.tags.map(t => `<span class="photo-tag tag-${t.type}">${t.text}</span>`).join('')
            : '<span class="ai-comment-loading" style="font-size:11px">标签生成中<span class="dot-anim"><span></span><span></span><span></span></span></span>';
        const commentHtml = comments && comments[i]
            ? `<div class="ai-comment"><span class="ai-comment-icon">🤖</span><span class="ai-comment-text">${comments[i]}</span></div>`
            : `<div class="ai-comment" id="ai-comment-${i}"><span class="ai-comment-icon">🤖</span><span class="ai-comment-loading">分析中<span class="dot-anim"><span></span><span></span><span></span></span></span></div>`;
        card.innerHTML = `
            <div class="img-wrapper">
                <img src="${photo.url}" alt="${photo.title}" loading="lazy" />
                <div class="ai-badge"><span class="star">⭐</span> ${photo.score}</div>
            </div>
            <div class="photo-tags">${tagsHtml}</div>
            <div class="photo-info">
                <div class="photo-title">📷 ${photo.title}</div>
                <div class="photo-desc">${photo.desc}</div>
                ${commentHtml}
            </div>`;
        grid.appendChild(card);
    });
    document.getElementById('photoCount').textContent = photos.length;
}

let _typeTimer = null;
function typeText(el, text, speed = 15) {
    if (_typeTimer) { clearTimeout(_typeTimer); _typeTimer = null; }
    el.innerHTML = '';
    let i = 0;
    (function type() {
        if (i < text.length) { el.innerHTML = text.substring(0, i+1) + '<span class="ai-cursor"></span>'; i++; _typeTimer = setTimeout(type, speed); }
        else { el.innerHTML = text + '<span class="ai-cursor"></span>'; _typeTimer = null; }
    })();
}

// Tag type mapping
const TAG_TYPE_MAP = {
    '风景':'scene','人像':'scene','动物':'scene','建筑':'scene','美食':'scene','街拍':'scene',
    '夜景':'scene','花卉':'scene','天空':'scene','海洋':'scene','森林':'scene','室内':'scene',
    '治愈':'mood','宁静':'mood','震撼':'mood','浪漫':'mood','孤独':'mood','欢乐':'mood',
    '神秘':'mood','温暖':'mood','忧郁':'mood','梦幻':'mood',
    '暖色调':'style','冷色调':'style','光影':'style','氛围感':'style','极简':'style',
    '复古':'style','高饱和':'style','黑白':'style','胶片感':'style',
    'nsfw':'nsfw'
};

function parseAndApplyComments(photos, text) {
    const comments = [];
    const tagsList = [];
    const lines = text.split('\n').filter(l => l.trim());
    let summary = '';
    for (const line of lines) {
        const photoMatch = line.match(/^\[(\d+)\]\s*(.+)/);
        if (photoMatch) {
            const idx = parseInt(photoMatch[1]) - 1;
            const content = photoMatch[2];
            // Extract score
            const scoreMatch = content.match(/评分:\s*(\d+\.\d)/);
            if (scoreMatch && idx < photos.length) {
                photos[idx].score = scoreMatch[1];
            }
            // Extract tags
            const tagsMatch = content.match(/标签:\s*(.+)/);
            if (tagsMatch && idx < photos.length) {
                const tagNames = tagsMatch[1].split(',').map(t => t.trim()).filter(Boolean);
                photos[idx].tags = tagNames.map(name => ({
                    text: name,
                    type: TAG_TYPE_MAP[name] || 'style'
                }));
                tagsList[idx] = photos[idx].tags;
            }
            // Clean comment text (remove score and tags)
            let comment = content.replace(/\s*\|\s*评分:\s*\d+\.\d/, '').replace(/\s*\|\s*标签:.*/, '').trim();
            comments[idx] = comment;
        }
        const sumMatch = line.match(/^\[总结\]\s*(.*)/);
        if (sumMatch) {
            // Collect multi-line summary: everything after [总结] until next [...] or end
            const sumIdx = text.indexOf('[总结]');
            if (sumIdx !== -1) {
                const afterSum = text.substring(sumIdx + 4).trim();
                // Stop at next [...] tag if any
                const nextTag = afterSum.indexOf('[');
                summary = (nextTag !== -1 ? afterSum.substring(0, nextTag) : afterSum).replace(/\*\*/g, '').trim();
            }
        }
    }
    // Re-render with updated scores, tags and comments
    renderPhotos(photos, comments);
    return { comments, summary };
}

async function refreshPhotos() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading'); btn.disabled = true;
    const localPhotos = await fetchPhotosFromFolder(config.folder);
    if (localPhotos && localPhotos.length > 0) photoDatabase = localPhotos;
    else if (localPhotos === null && photoDatabase.length === 0) photoDatabase = [];
    const count = Math.min(4, photoDatabase.length);
    const photos = shuffleArray(photoDatabase).slice(0, count);
    // Render cards with loading state first
    renderPhotos(photos, null);
    document.getElementById('lastUpdate').textContent = `${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`;
    document.getElementById('aiAnalysis').innerHTML = '🔍 正在逐张分析照片...<span class="ai-cursor"></span>';
    // Call vision API
    const analysis = await analyzePhotosWithVision(photos);
    const { comments, summary } = parseAndApplyComments(photos, analysis);
    // Show summary in bottom panel
    const summaryText = summary || `今天精选了 ${photos.length} 张照片，整体色彩和谐，构图均衡，每张都有独特的故事感。`;
    // Display summary directly (avoid typeText race conditions)
    document.getElementById('aiAnalysis').innerHTML = `📸 选片总结：${summaryText}`;
    btn.classList.remove('loading'); btn.disabled = false;
}

// ========== Config Modal ==========
function openConfig() {
    document.getElementById('cfgApiBase').value = config.apiBase;
    document.getElementById('cfgApiKey').value = config.apiKey;
    document.getElementById('cfgModel').value = config.model;
    document.getElementById('cfgFolder').value = config.folder;
    document.getElementById('cfgStatus').className = 'config-status';
    document.getElementById('cfgStatus').textContent = '';
    document.getElementById('configModal').classList.add('active');
}
function closeConfig(e) {
    if (!e || e.target === document.getElementById('configModal'))
        document.getElementById('configModal').classList.remove('active');
}
function saveConfig() {
    config.apiBase = document.getElementById('cfgApiBase').value.trim();
    config.apiKey = document.getElementById('cfgApiKey').value.trim();
    config.model = document.getElementById('cfgModel').value.trim();
    config.folder = document.getElementById('cfgFolder').value.trim() || '/path/to/your/photos';
    saveConfigToStorage(config);
    const st = document.getElementById('cfgStatus');
    if (config.apiKey && config.apiBase && config.model) {
        st.className = 'config-status ok';
        st.textContent = '✅ 配置已保存，刷新后生效';
    } else {
        st.className = 'config-status ok';
        st.textContent = '✅ 已保存（未配置 API 将使用模拟点评）';
    }
    setTimeout(() => { closeConfig(); refreshPhotos(); }, 1000);
}

// ========== Photo Modal ==========
function openModal(i) { currentModalIndex=i; updateModalContent(); document.getElementById('modal').classList.add('active'); document.body.style.overflow='hidden'; }
function updateModalContent() {
    const p = currentPhotos[currentModalIndex];
    document.getElementById('modalImg').src = p.url;
    document.getElementById('modalTitle').textContent = `📷 ${p.title}`;
    document.getElementById('modalCounter').textContent = `${currentModalIndex+1} / ${currentPhotos.length}`;
}
function navPhoto(d) { currentModalIndex=(currentModalIndex+d+currentPhotos.length)%currentPhotos.length; updateModalContent(); }
function closeModal(e) { if(!e||e.target===document.getElementById('modal')){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';} }
document.addEventListener('keydown', e => {
    if (!document.getElementById('modal').classList.contains('active')) return;
    if (e.key==='Escape') closeModal();
    if (e.key==='ArrowLeft') navPhoto(-1);
    if (e.key==='ArrowRight') navPhoto(1);
});

// ========== Init ==========
(async function init() {
    const now = new Date(), wd = ['日','一','二','三','四','五','六'];
    document.getElementById('dateBadge').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${wd[now.getDay()]}`;
    document.getElementById('lastUpdate').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    // Health check
    try {
        const r = await fetch(`${PHOTO_API}/api/health`);
        const h = await r.json();
        const dot = document.getElementById('aiDot');
        const label = document.getElementById('aiModel');
        if (h.ok) { dot.className = 'dot ok'; label.textContent = h.model; }
        else { dot.className = 'dot err'; label.textContent = h.model + ' 异常'; }
    } catch { document.getElementById('aiDot').className = 'dot err'; document.getElementById('aiModel').textContent = 'API 不可达'; }
    refreshPhotos();
})();
